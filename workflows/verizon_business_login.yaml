name: "verizon-business-login"

settings:
  headless: false
  timeout_ms: 30000
  slow_mo_ms: 75
  screenshot_dir: "artifacts/screenshots"

variables:
  # Set these in your shell before running:
  # export VZW_BUSINESS_USERNAME="..."
  # export VZW_BUSINESS_PASSWORD="..."
  # export VZW_BUSINESS_OTP="123456"
  username: "${VZW_BUSINESS_USERNAME}"
  password: "${VZW_BUSINESS_PASSWORD}"
  otp_code: "${VZW_BUSINESS_OTP}"
  byod_url: "https://mb.verizonwireless.com/mbt/secure/index?appName=comm&transType=NSO&navtrk=globalnav:shop:bringyourowndevice#/nso-landing/devicevalidation/mobile-evolution"
  byod_device_imei: "358339770214328"
  byod_sim_iccid: "${BYOD_SIM_ICCID}"
  byod_zip_code: "94402"
  byod_user_first_name: "Daniel"
  byod_user_last_name: "Kroeger"
  byod_user_email: "daniel.kroeger@skydio.com"
  byod_user_address1: "3000 Clearview Way"
  byod_user_city: "San Mateo"
  byod_user_state: "CA"
  byod_user_zip: "94402"

steps:
  - action: goto
    url: "https://mblogin.verizonwireless.com/account/business/login/unifiedlogin"

  # Step 1: username page
  - action: fill
    selector:
      - "#pwdUserID"
      - "input[name='pwd_userid']"
    value: "{{ username }}"
    selector_timeout_ms: 4000

  - action: click
    selector:
      - "#submitUserID"
      - "button[name='submitUserID']"
      - "button[type='submit']"
      - "button:has-text('Continue')"
    selector_timeout_ms: 4000

  # Wait for username submit to move to the next auth stage.
  - action: wait_for_url
    regex: "^https://mblogin\\.verizonwireless\\.com/account/business/login/(password|otpdelivery|options)(?:\\?|$)"
    timeout_ms: 30000
    continue_on_error: true

  # Retry submit once if still on username screen.
  - action: click
    selector:
      - "#submitUserID"
      - "button[name='submitUserID']"
      - "button:has-text('Continue')"
    only_if_selector:
      - "#submitUserID"
      - "input[name='pwd_userid']"
    only_if_selector_timeout_ms: 1500
    selector_timeout_ms: 3000
    continue_on_error: true

  - action: wait_for_url
    regex: "^https://mblogin\\.verizonwireless\\.com/account/business/login/(password|otpdelivery|options)(?:\\?|$)"
    timeout_ms: 20000
    continue_on_error: true

  # Some accounts are routed to an options page first. Choose Password branch.
  - action: click
    selector:
      - "a:has-text('Password')"
      - "text=Password"
      - ".pwdless_option_text:has-text('Password')"
    only_if_selector:
      - "text=How do you want to log in?"
      - "a:has-text('Password')"
    only_if_selector_timeout_ms: 1500
    selector_timeout_ms: 5000
    continue_on_error: true

  - action: wait_for_url
    regex: "^https://mblogin\\.verizonwireless\\.com/account/business/login/(password|otpdelivery)(?:\\?|$)"
    timeout_ms: 20000
    continue_on_error: true

  # Recovery branch: Verizon occasionally renders an orange error banner page
  # without following the expected URL transitions.
  - action: extract_text
    selector:
      - "text=Sorry we are not able to process your request at this time."
    save_as: "login_error_banner"
    selector_timeout_ms: 2500
    optional: true
    default: ""

  - action: click
    selector:
      - "text=Back to Login Page."
      - "text=Back to Login Page"
    only_if_variable_set: "login_error_banner"
    selector_timeout_ms: 5000

  - action: wait_for_selector
    selector:
      - "#pwdUserID"
      - "input[name='pwd_userid']"
    state: visible
    selector_timeout_ms: 30000
    only_if_variable_set: "login_error_banner"

  - action: fill
    selector:
      - "#pwdUserID"
      - "input[name='pwd_userid']"
    value: "{{ username }}"
    selector_timeout_ms: 6000
    only_if_variable_set: "login_error_banner"

  - action: click
    selector:
      - "#submitUserID"
      - "button[name='submitUserID']"
      - "button[type='submit']"
      - "button:has-text('Continue')"
    selector_timeout_ms: 6000
    only_if_variable_set: "login_error_banner"

  - action: wait_for_url
    regex: "^https://mblogin\\.verizonwireless\\.com/account/business/login/(password|otpdelivery|options)(?:\\?|$)"
    timeout_ms: 30000
    continue_on_error: true
    only_if_variable_set: "login_error_banner"

  - action: click
    selector:
      - "a:has-text('Password')"
      - "text=Password"
      - ".pwdless_option_text:has-text('Password')"
    only_if_variable_set: "login_error_banner"
    only_if_selector:
      - "text=How do you want to log in?"
      - "a:has-text('Password')"
    only_if_selector_timeout_ms: 1500
    selector_timeout_ms: 5000
    continue_on_error: true

  - action: wait_for_url
    regex: "^https://mblogin\\.verizonwireless\\.com/account/business/login/(password|otpdelivery)(?:\\?|$)"
    timeout_ms: 20000
    continue_on_error: true
    only_if_variable_set: "login_error_banner"

  # Step 2: password page (only when password field is present)
  - action: fill
    selector:
      - "input[type='password']"
      - "input[autocomplete='current-password']"
    value: "{{ password }}"
    only_if_selector:
      - "input[type='password']"
      - "input[autocomplete='current-password']"
    only_if_selector_timeout_ms: 1500
    selector_timeout_ms: 8000
    continue_on_error: true

  - action: click
    selector:
      - "button[type='submit']"
      - "button:has-text('Sign in')"
      - "button:has-text('Log in')"
      - "input[type='submit']"
    only_if_selector:
      - "input[type='password']"
      - "input[autocomplete='current-password']"
    only_if_selector_timeout_ms: 1000
    selector_timeout_ms: 8000
    continue_on_error: true

  # Step 3: OTP challenge (if prompted)
  # Optional delivery-method step for flows that show "Select a verification method".
  - action: click
    selector:
      - "a:has-text('Text')"
      - ".pwdless_option_text:has-text('Text')"
      - "button:has-text('Text')"
      - "[role='button']:has-text('Text')"
      - "label:has-text('Text')"
    selector_timeout_ms: 6000
    continue_on_error: true
    only_if_url_regex: "/account/business/login/otpdelivery"

  # Optional trigger to send OTP after method selection.
  - action: click
    selector:
      - "button:has-text('Continue'):not([disabled])"
      - "button:has-text('Send code'):not([disabled])"
      - "button:has-text('Verify'):not([disabled])"
      - "button[type='submit']:not([disabled])"
    selector_timeout_ms: 3000
    continue_on_error: true
    only_if_url_regex: "/account/business/login/otpdelivery"

  - action: wait_for_selector
    selector:
      - "input[autocomplete='one-time-code']"
      - "input[name*='otp' i]"
      - "input[id*='otp' i]"
      - "input[name*='code' i]"
      - "input[id*='code' i]"
      - "input[inputmode='numeric']"
      - "input[type='tel']"
    state: visible
    selector_timeout_ms: 45000
    continue_on_error: true
    only_if_url_regex: "/account/business/login/otpdelivery"

  # Prompt only when OTP entry field is actually present.
  - action: prompt_variable
    name: "otp_code"
    prompt: "Enter current Verizon OTP code: "
    secret: true
    if_empty_only: true
    required: false
    continue_on_error: true
    only_if_selector:
      - "input[autocomplete='one-time-code']"
      - "input[name*='otp' i]"
      - "input[id*='otp' i]"
      - "input[name*='code' i]"
      - "input[id*='code' i]"
      - "input[inputmode='numeric']"
      - "input[type='tel']"
    only_if_selector_timeout_ms: 1500
    only_if_url_regex: "/account/business/login/otpdelivery"

  # Non-interactive fallback for cloud runs:
  # when OTP input appears, wait for this file to be populated with the current OTP.
  # Example: mkdir -p .runtime && printf '%s' '123456' > .runtime/verizon_otp.txt
  - action: set_variable_from_file
    name: "otp_code"
    path: ".runtime/verizon_otp.txt"
    if_empty_only: true
    only_if_selector:
      - "input[autocomplete='one-time-code']"
      - "input[name*='otp' i]"
      - "input[id*='otp' i]"
      - "input[name*='code' i]"
      - "input[id*='code' i]"
      - "input[inputmode='numeric']"
      - "input[type='tel']"
    only_if_selector_timeout_ms: 2000
    timeout_ms: 600000
    poll_interval_ms: 1000
    delete_after_read: true
    only_if_url_regex: "/account/business/login/otpdelivery"

  - action: fill
    selector:
      - "input[autocomplete='one-time-code']"
      - "input[name*='otp' i]"
      - "input[id*='otp' i]"
      - "input[name*='code' i]"
      - "input[id*='code' i]"
      - "input[inputmode='numeric']"
      - "input[type='tel']"
    value: "{{ otp_code }}"
    selector_timeout_ms: 8000
    continue_on_error: true
    only_if_variable_set: "otp_code"
    only_if_url_regex: "/account/business/login/otpdelivery"

  - action: click
    selector:
      - "button:has-text('Verify')"
      - "button:has-text('Continue')"
      - "button:has-text('Submit')"
      - "button:has-text('Log in')"
      - "button[type='submit']"
      - "input[type='submit']"
    selector_timeout_ms: 8000
    continue_on_error: true
    only_if_variable_set: "otp_code"
    only_if_url_regex: "/account/business/login/otpdelivery"

  # Wait and capture post-login state
  - action: wait_for_timeout
    ms: 12000

  - action: screenshot
    path: "artifacts/screenshots/verizon_after_login.png"
    full_page: true

  # Step 4: navigate to BYOD and verify page load
  - action: goto
    url: "{{ byod_url }}"
    wait_until: "domcontentloaded"

  - action: wait_for_url
    regex: "^https://mb\\.verizonwireless\\.com/mbt/secure/index\\?.*#/nso-landing/devicevalidation/mobile-evolution$"
    timeout_ms: 90000

  - action: wait_for_selector
    selector:
      - "text=Tell us about your device."
      - "text=Device ID (IMEI)"
      - "text=Bring Your Own Device"
    state: attached
    selector_timeout_ms: 90000

  # Dismiss cookie banner if present to avoid overlay side effects.
  - action: click
    selector:
      - "#transcend-consent-manager button:has-text('Close')"
      - "button:has-text('Close')"
    selector_timeout_ms: 3000
    continue_on_error: true

  # Step 5: fill BYOD form fields
  - action: click
    selector:
      - "div.radio-box-item:has-text('I want a new phone number')"
      - "text=I want a new phone number"
    selector_timeout_ms: 8000

  # Ensure promotional toggle is off for Month-to-Month path.
  - action: set_checkbox
    selector:
      - "#toggleCheckBox"
    checked: false
    selector_timeout_ms: 2000

  # Fallback: force-click visual switch if still shown as ON.
  - action: click
    selector:
      - ".ToggleSwitchSlider.SwitchOn"
    force: true
    selector_timeout_ms: 2000
    continue_on_error: true
    only_if_selector:
      - ".ToggleSwitchSlider.SwitchOn"
    only_if_selector_timeout_ms: 1000

  - action: wait_for_selector
    selector:
      - "#toggleCheckBox:not(:checked)"
      - ".ToggleSwitchSlider.SwitchOff"
    state: attached
    selector_timeout_ms: 5000

  - action: fill
    selector:
      - "input[formcontrolname='deviceId']:visible"
      - "xpath=//label[normalize-space()='Device ID (IMEI)']/following::input[@type='text' and not(@disabled)][1]"
      - "input.Form-input.width:visible"
    value: "{{ byod_device_imei }}"
    selector_timeout_ms: 12000
    selector_state: visible

  - action: wait_for_timeout
    ms: 1500

  - action: select
    selector:
      - "select[formcontrolname='simType']:visible"
      - "xpath=//label[normalize-space()='SIM']/following::select[not(@disabled)][1]"
      - "select[aria-label='Select-Option']:visible"
    value: "haveOwnPSim"
    selector_timeout_ms: 12000
    selector_state: visible

  - action: wait_for_selector
    selector:
      - "text=SIM number"
      - "xpath=//label[normalize-space()='SIM number']"
    state: visible
    selector_timeout_ms: 12000

  # BYOD_SIM_ICCID is the only per-run variable. Prompt when not pre-set in env.
  - action: prompt_variable
    name: "byod_sim_iccid"
    prompt: "Enter BYOD SIM ICCID (20 digits): "
    secret: false
    if_empty_only: true
    required: true
    only_if_url_regex: "/nso-landing/devicevalidation/mobile-evolution"

  - action: normalize_variable
    name: "byod_sim_iccid"
    mode: "digits_only"
    min_length: 20
    max_length: 20

  - action: set_input_value
    selector:
      - "input[formcontrolname='simId']:visible"
      - "xpath=//label[normalize-space()='SIM number']/following::input[@type='text' and not(@disabled)][1]"
      - "input[aria-label='Quantity']:visible"
    value: "{{ byod_sim_iccid }}"
    selector_timeout_ms: 12000
    selector_state: visible
    dispatch_events: true

  # Also type via keyboard events to satisfy client-side directives.
  - action: press
    selector:
      - "input[formcontrolname='simId']:visible"
      - "xpath=//label[normalize-space()='SIM number']/following::input[@type='text' and not(@disabled)][1]"
      - "input[aria-label='Quantity']:visible"
    key: "ControlOrMeta+A"
    selector_timeout_ms: 5000
    selector_state: visible

  - action: type
    selector:
      - "input[formcontrolname='simId']:visible"
      - "xpath=//label[normalize-space()='SIM number']/following::input[@type='text' and not(@disabled)][1]"
      - "input[aria-label='Quantity']:visible"
    text: "{{ byod_sim_iccid }}"
    selector_timeout_ms: 12000
    selector_state: visible
    delay_ms: 20

  - action: extract_attr
    selector:
      - "input[formcontrolname='simId']:visible"
      - "xpath=//label[normalize-space()='SIM number']/following::input[@type='text' and not(@disabled)][1]"
      - "input[aria-label='Quantity']:visible"
    attr: "value"
    save_as: "byod_sim_iccid_ui_value"
    selector_state: visible
    selector_timeout_ms: 3000
    continue_on_error: true

  # Trigger validation by blurring SIM number field.
  - action: press
    selector:
      - "input[formcontrolname='simId']:visible"
      - "xpath=//label[normalize-space()='SIM number']/following::input[@type='text' and not(@disabled)][1]"
      - "input[aria-label='Quantity']:visible"
    key: "Tab"
    selector_timeout_ms: 8000
    selector_state: visible

  - action: wait_for_timeout
    ms: 1500

  - action: extract_attr
    selector:
      - "input[formcontrolname='simId']:visible"
      - "xpath=//label[normalize-space()='SIM number']/following::input[@type='text' and not(@disabled)][1]"
      - "input[aria-label='Quantity']:visible"
    attr: "value"
    save_as: "byod_sim_iccid_ui_value_after_blur"
    selector_state: visible
    selector_timeout_ms: 3000
    continue_on_error: true

  - action: screenshot
    path: "artifacts/screenshots/byod_before_confirm.png"
    full_page: true

  # Helpful diagnostics if button doesn't enable.
  - action: extract_text
    selector:
      - "text=Please enter valid SIM number."
      - "text=SIM number is required."
      - "text=Please enter valid Device ID."
      - "text=Device Id is required."
    save_as: "byod_validation_hint"
    selector_timeout_ms: 1500
    optional: true
    default: ""

  - action: select
    selector:
      - "select[name='contract0']:visible"
      - "xpath=//label[normalize-space()='Contract term']/following::select[not(@disabled)][1]"
    value: "0"
    selector_timeout_ms: 12000
    selector_state: visible

  - action: wait_for_selector
    selector:
      - "button:has-text('Confirm devices'):not([disabled])"
    state: visible
    selector_timeout_ms: 60000

  - action: click
    selector:
      - "button:has-text('Confirm devices'):not([disabled])"
    selector_timeout_ms: 12000

  - action: wait_for_selector
    selector:
      - "text=Review your devices."
      - "h1:has-text('Review your devices.')"
    state: visible
    selector_timeout_ms: 60000

  - action: extract_text
    selector:
      - "text=already in the cart and hence cannot be added again."
    save_as: "byod_review_warning"
    selector_timeout_ms: 2000
    optional: true
    default: ""

  - action: screenshot
    path: "artifacts/screenshots/byod_review_devices.png"
    full_page: true

  # Continue from review page even if duplicate-warning banner is present.
  - action: wait_for_selector
    selector:
      - "button:has-text('Continue')"
    state: visible
    selector_timeout_ms: 30000

  - action: click
    selector:
      - "button:has-text('Continue')"
    selector_timeout_ms: 12000

  - action: wait_for_timeout
    ms: 5000

  - action: screenshot
    path: "artifacts/screenshots/byod_after_review_continue.png"
    full_page: true

  # Success assertion: verify we reached Verizon Data Plans / Select plan page.
  - action: wait_for_selector
    selector:
      - "text=Select plan"
      - "text=Select a wireless plan"
      - "text=Verizon Data Plans"
      - "text=Business Unlimited Plus 5G Smartphone"
      - "text=Unlimited Plus 5G Smartphone"
      - "button:has-text('Select plan')"
      - "button:has-text('Select')"
    state: visible
    selector_timeout_ms: 60000
    continue_on_error: true

  - action: extract_text
    selector:
      - "text=Select plan"
      - "text=Select a wireless plan"
      - "text=Business Unlimited Plus 5G Smartphone"
      - "h1"
    save_as: "byod_next_page_checkpoint"
    optional: true
    default: "Select plan page reached"
    selector_timeout_ms: 2000

  - action: screenshot
    path: "artifacts/screenshots/byod_select_plan_checkpoint.png"
    full_page: true

  # Step 6: Select required plan and continue
  - action: wait_for_selector
    selector:
      - "text=Business Unlimited Plus 5G Smartphone"
    state: visible
    selector_timeout_ms: 90000

  - action: wait_for_selector
    selector:
      - "text=$48.00"
      - "text=48.00"
    state: visible
    selector_timeout_ms: 90000

  - action: wait_for_selector
    selector:
      - "xpath=//h1[contains(normalize-space(),'Select plan')]/following::button[contains(normalize-space(),'Continue') and not(@disabled)][1]"
      - "button:has-text('Continue'):not([disabled])"
      - "xpath=(//*[contains(normalize-space(),'Business Unlimited Plus 5G Smartphone')])[1]/ancestor::*[.//button[contains(translate(normalize-space(.),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'),'select')]][1]//button[contains(translate(normalize-space(.),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'),'select') and not(@disabled) and not(@aria-disabled='true')]"
      - "xpath=//button[contains(translate(normalize-space(.),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'),'select') and not(@disabled) and not(@aria-disabled='true')]"
      - "button:has-text('Select'):not([disabled]):not([aria-disabled='true'])"
      - "button:has-text('SELECT'):not([disabled]):not([aria-disabled='true'])"
    state: visible
    selector_timeout_ms: 90000

  - action: click
    selector:
      - "xpath=(//*[contains(normalize-space(),'Business Unlimited Plus 5G Smartphone')])[1]/ancestor::*[.//button[contains(translate(normalize-space(.),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'),'select') and not(@disabled) and not(@aria-disabled='true')]][1]//button[contains(translate(normalize-space(.),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'),'select') and not(@disabled) and not(@aria-disabled='true')][1]"
      - "xpath=(//*[contains(normalize-space(),'Business Unlimited Plus 5G Smartphone')])[1]/following::button[contains(translate(normalize-space(.),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'),'select') and not(@disabled) and not(@aria-disabled='true')][1]"
      - "xpath=(//button[contains(translate(normalize-space(.),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'),'select') and not(@disabled) and not(@aria-disabled='true')])[1]"
      - "button:has-text('Select'):not([disabled]):not([aria-disabled='true'])"
      - "button:has-text('SELECT'):not([disabled]):not([aria-disabled='true'])"
    only_if_not_selector:
      - "xpath=//h1[contains(normalize-space(),'Select plan')]/following::button[contains(normalize-space(),'Continue') and not(@disabled)][1]"
      - "button:has-text('Continue'):not([disabled])"
    only_if_not_selector_timeout_ms: 1500
    selector_timeout_ms: 20000
    continue_on_error: true
    force: true

  - action: wait_for_timeout
    ms: 2500

  - action: wait_for_selector
    selector:
      - "xpath=//h1[contains(normalize-space(),'Select plan')]/following::button[contains(normalize-space(),'Continue') and not(@disabled)][1]"
      - "button:has-text('Continue'):not([disabled])"
    state: visible
    selector_timeout_ms: 30000

  - action: click
    selector:
      - "xpath=//h1[contains(normalize-space(),'Select plan')]/following::button[contains(normalize-space(),'Continue') and not(@disabled)][1]"
      - "button:has-text('Continue'):not([disabled])"
    selector_timeout_ms: 12000

  # Step 7: Destination checkpoint after Select Plan continue.
  # Prefer URL transition away from dataplans, but don't hard-fail if Verizon keeps URL stable.
  - action: wait_for_url
    regex: "^https://mb\\.verizonwireless\\.com/mbt/secure/index\\?.*#/(?!nso-landing/dataplans).+$"
    timeout_ms: 90000
    continue_on_error: true

  - action: wait_for_timeout
    ms: 4000

  - action: extract_text
    selector:
      - "text=Device protection"
      - "text=Protect your device"
      - "text=Protection for your device"
      - "text=Add-ons"
      - "text=Accessories"
      - "text=Review your order"
      - "text=Order summary"
      - "h1"
      - "h2"
    save_as: "post_select_plan_destination_checkpoint"
    optional: true
    default: "Post-Select-Plan destination reached"
    selector_timeout_ms: 3000
    selector_state: visible

  - action: screenshot
    path: "artifacts/screenshots/byod_after_plan_destination_checkpoint.png"
    full_page: true

  # Step 8: Next-page automation (common Verizon branch: Device Protection).
  - action: click
    selector:
      - "button:has-text('No thanks')"
      - "button:has-text('No Thanks')"
      - "button:has-text('No, thanks')"
      - "xpath=//button[contains(translate(normalize-space(.),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'),'no thanks')]"
      - "xpath=//label[contains(translate(normalize-space(.),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'),'no thanks')]"
    only_if_selector:
      - "button:has-text('No thanks')"
      - "button:has-text('No Thanks')"
      - "button:has-text('No, thanks')"
      - "xpath=//button[contains(translate(normalize-space(.),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'),'no thanks')]"
      - "xpath=//label[contains(translate(normalize-space(.),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'),'no thanks')]"
